services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: plan2site-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirement.txt && python database.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0

  # 2. Next.js Frontend Web Service
  - type: web
    name: plan2site-frontend
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
